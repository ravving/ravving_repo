# Every pull request and push: the entries checked (tools/validate.py). Read-only, with the
# contributor's files never run: plain pull_request, no secrets.
name: validate
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/validate.py
